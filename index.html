<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glowlogics Notes</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#182230}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 8px 24px #0001;margin-bottom:20px}input,textarea,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #d9deea}input,textarea{width:100%;box-sizing:border-box;margin:6px 0 12px}button{background:#5146e5;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.note{border:1px solid #e3e7ef;padding:16px;border-radius:12px}.note small{color:#7b8494}.delete{float:right;background:#fff;color:#d33;border:1px solid #f0caca;padding:5px 8px}</style></head><body><div class="wrap"><h1>Glowlogics Notes</h1><p>Simple notes manager with browser storage.</p><div class="card"><input id="title" placeholder="Note title"><textarea id="body" rows="5" placeholder="Write your note..."></textarea><button onclick="addNote()">Add note</button></div><div class="card"><input id="search" placeholder="Search notes" oninput="render()"><div id="notes" class="grid"></div></div></div><script>const key='glowlogics-notes';let notes=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(notes))}function addNote(){let t=title.value.trim(),b=body.value.trim();if(!t&&!b)return;notes.unshift({id:Date.now(),t:t||'Untitled note',b,date:new Date().toLocaleDateString()});title.value='';body.value='';save();render()}function removeNote(id){notes=notes.filter(n=>n.id!==id);save();render()}function render(){let q=search.value.toLowerCase();document.getElementById('notes').innerHTML=notes.filter(n=>(n.t+' '+n.b).toLowerCase().includes(q)).map(n=>`<article class="note"><button class="delete" onclick="removeNote(${n.id})">Delete</button><small>${n.date}</small><h3>${n.t}</h3><p>${n.b||'No text'}</p></article>`).join('')||'<p>No notes yet.</p>'}render()</script></body></html>
